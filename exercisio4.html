
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exercício 4</title>
</head>
<body>

<script>
let n1 = parseInt(prompt("Digite um número inteiro positivo:"));

if (n1 > 0) {
    let soma = 0;

    for (let i = 1; i <= n1; i++) {
        soma = soma + i;
    }

    alert("A soma de 1 até " + n1 + " é " + soma);
} else {
    alert("Digite um número inteiro positivo.");
}
</script>

</body>
</html>
