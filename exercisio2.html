
<!DOCTYPE html>
<html lang="pt-BR">

</head>
<body>
    <script>
        n1 = parseInt(prompt("Digite o primeiro número:"));
        n2 = parseInt(prompt("Digite o segundo número:"));
        n3 = parseInt(prompt("Digite o terceiro número:"));

        if (n1 > n2 && n1 > n3) {
            alert("O maior número é o " + n1);
        } else if (n2 > n1 && n2 > n3) {
            alert("O maior número é o " + n2);
        } else if (n3 > n1 && n3 > n2) {
            alert("O maior número é o " + n3);
        } else {
            alert("os 3 numeros e inguais.");
        }
    </script>
</body>
